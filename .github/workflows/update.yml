name: Daten aktualisieren
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests lxml
      - run: python update_alle.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data_alle
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
